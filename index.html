<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="mensaje-container">

            <p class="detalle">¡AVISO!</p>

            <h1 id="mensaje">
                Te amo mucho ❤️
            </h1>

        </section>

    <section class="panel">
    
        <div class="textarea-container">
    
            <textarea
                id="entradaMensaje"
                placeholder="Escribe algo para ella..."
                maxlength="250"
            ></textarea>
    
            <button
                id="botonEmoji"
                class="boton-emoji"
                type="button"
                title="Agregar emoji"
            >
                😊
            </button>
    
        </div>
    
    
        <div id="selectorEmojis" class="selector-emojis">
    
            <button type="button">❤️</button>
            <button type="button">💕</button>
            <button type="button">💖</button>
            <button type="button">💗</button>
            <button type="button">💓</button>
            <button type="button">💞</button>
    
            <button type="button">🥰</button>
            <button type="button">😍</button>
            <button type="button">😘</button>
            <button type="button">☺️</button>
            <button type="button">😊</button>
            <button type="button">🥹</button>
    
            <button type="button">🫶</button>
            <button type="button">💋</button>
            <button type="button">🌹</button>
            <button type="button">✨</button>
            <button type="button">🌙</button>
            <button type="button">🦋</button>
    
            <button type="button">😂</button>
            <button type="button">😭</button>
            <button type="button">😳</button>
            <button type="button">🙄</button>
            <button type="button">😡</button>
            <button type="button">😴</button>
    
        </div>
    
    
        <div class="botones">
    
            <button id="mostrarMensaje">
                Mostrar mensaje ❤️
            </button>
    
            <button id="limpiarMensaje" class="secundario">
                Limpiar
            </button>
    
        </div>
    
    </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
